[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur"
version = "1.0.0"
description = "Spatio-temporal acoustic monitoring and predictive maintenance for industrial plant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Murmur Team" }]
keywords = [
    "acoustic-monitoring",
    "predictive-maintenance",
    "gnn",
    "liquid-neural-networks",
    "kafka",
    "llm",
    "audio-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Upper bounds are deliberate: torch/transformers ship breaking changes in
# minor releases, and an unpinned production image is not reproducible.
dependencies = [
    "torch>=2.1.2,<3.0",
    "torchaudio>=2.1.2,<3.0",
    "torch_geometric>=2.4.0,<3.0",
    "scipy>=1.12.0,<2.0",
    "numpy>=1.26.3,<3.0",
    "ncps>=0.0.7,<0.1",
    "transformers>=4.37.2,<5.0",
    "accelerate>=0.26.1,<2.0",
    "fastapi>=0.109.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "websockets>=12.0",
    "pydantic>=2.5.3,<3.0",
    "confluent-kafka>=2.3.0,<3.0",
    "msgpack>=1.0.7,<2.0",
    "prometheus-client>=0.20.0,<1.0",
    "httpx>=0.26,<1.0",
]

[project.optional-dependencies]
# Kept out of the serving images: MLOps tooling is enormous and is only needed
# by the training and orchestration entrypoints.
mlops = ["dagster>=1.6.0,<2.0", "mlflow>=2.9.2,<4.0"]
cuda = ["pycuda>=2024.1"]
# src/export/onnx_export.py degrades gracefully without these — torch.onnx
# writes the graph unaided — but verification and INT8 quantization need them,
# and nothing else declared what `python -m src.export.onnx_export` depends on.
export = ["onnx>=1.15,<2.0", "onnxruntime>=1.17,<2.0"]
dev = [
    "murmur[mlops]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.16.0",
]

[project.scripts]
murmur-ingest = "src.ingestion.cuda_stream_processor:main"
murmur-simulate = "src.ingestion.mock_edge_device:main"
murmur-worker = "src.inference.worker:main"
murmur-train = "src.training.train_pipeline:main"

[project.urls]
Homepage = "https://github.com/smparc/murmur"
Repository = "https://github.com/smparc/murmur"

[tool.setuptools.packages.find]
# benchmarks* is here because the test suite imports it. Without it `pip
# install -e .` does not expose the package, and CI — which invokes `pytest`
# directly rather than `python -m pytest` — has no CWD on sys.path to fall back
# on, so every test file touching it fails at collection. That aborts the whole
# run, including jobs whose own tests would have been skipped.
include = ["src*", "orchestration*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: requires external services (Kafka, etc.)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__main__.py", "*/stft_kernels.cu"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Claude Code checks agent worktrees out under .claude/worktrees/, which are
# full copies of this repository. Without this, every lint run reports each
# finding once per worktree and a stale branch can fail CI on code that is not
# even on the current one.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is idiomatic
    "RUF012",  # ClassVar annotations add noise to plain config holders
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use assert-heavy style.
"tests/*" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
