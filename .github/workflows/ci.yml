name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  INGEST_IMAGE_NAME: ${{ github.repository_owner }}/murmur-ingest
  INFERENCE_IMAGE_NAME: ${{ github.repository_owner }}/murmur-inference

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install ruff==0.16.1

      # benchmarks/ is included deliberately: it was added without being listed
      # here, so ~1,700 lines of it were never linted by CI.
      - name: ruff check
        run: ruff check src/ tests/ orchestration/ benchmarks/

      - name: ruff format --check
        run: ruff format --check src/ tests/ orchestration/ benchmarks/

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only wheels keep the runner fast; CUDA is exercised in the image build.
      - name: Install torch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  integration:
    name: Integration (Kafka)
    runs-on: ubuntu-latest
    services:
      kafka:
        # The Apache project's own image. Bitnami withdrew its versioned tags
        # from Docker Hub, so `bitnami/kafka:3.7` no longer resolves anywhere —
        # note the env prefix differs between the two (KAFKA_ vs KAFKA_CFG_),
        # so the settings below are not interchangeable with Bitnami's.
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: controller,broker
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          # One client listener is enough: nothing else runs in the service
          # network. It must advertise localhost, because the client is the
          # runner host reaching in through the mapped port — advertising the
          # container hostname would redirect it somewhere it cannot resolve.
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install torch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio

      - name: Install package
        run: pip install -e ".[dev]"

      # An open TCP port is not a ready broker, and the difference matters here:
      # the test fixture skips when metadata is unavailable, so a half-started
      # Kafka would produce a green run that tested nothing. This performs the
      # same metadata round trip the fixture does, and fails loudly instead.
      - name: Wait for Kafka to serve metadata
        run: |
          python - <<'PY'
          import sys, time
          from confluent_kafka import KafkaException, Producer

          for attempt in range(1, 31):
              try:
                  Producer({"bootstrap.servers": "localhost:9092"}).list_topics(timeout=5)
              except KafkaException as exc:
                  print(f"attempt {attempt}/30: {exc}")
                  time.sleep(2)
              else:
                  print("Kafka is serving metadata")
                  sys.exit(0)

          print("Kafka did not become ready in time", file=sys.stderr)
          sys.exit(1)
          PY

      # Fails rather than skips: reaching this step means the broker answered,
      # so a skip would mean the suite quietly stopped covering this path.
      - name: Run integration tests
        run: pytest tests/ -m integration -p no:cacheprovider --no-header -ra

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-images:
    name: Build & push images
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: INGEST_IMAGE_NAME
            dockerfile: deploy/Dockerfile.ingest
          - image: INFERENCE_IMAGE_NAME
            dockerfile: deploy/Dockerfile.inference
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env[matrix.image] }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-k8s:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/
