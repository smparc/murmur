# Local Kafka broker for development.
#
# Uses the Apache project's own image. This previously ran Bitnami, which
# withdrew its versioned tags from Docker Hub — `bitnami/kafka:3.7` no longer
# resolves, so the file could not start at all. The two images also differ in
# env prefix (KAFKA_ here, KAFKA_CFG_ on Bitnami) and in data directory, so the
# settings are not interchangeable.
#
# The advertised listeners are the important part. A broker tells clients which
# address to reconnect on, and without an explicit setting it advertises the
# container hostname — so a client on the host connects to localhost:9092, is
# redirected to "murmur-kafka-broker:9092", and fails to resolve it. Two
# listeners are declared: EXTERNAL for host tooling, INTERNAL for other
# containers on the compose network.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: murmur-kafka-broker
    ports:
      - "9092:9092"
    environment:
      # --- KRaft mode (no Zookeeper) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # --- Listeners ---
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # --- Topics ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker development cluster: replication cannot exceed one.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Audio is high volume and only useful while fresh.
      KAFKA_LOG_RETENTION_HOURS: "6"
      KAFKA_MESSAGE_MAX_BYTES: "10485760"

      # The image defaults to /tmp, which does not survive a container restart.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - murmur_kafka_data:/var/lib/kafka/data
    healthcheck:
      # Dependents can then wait for a broker that actually accepts client
      # connections, rather than merely a running container.
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  murmur_kafka_data:
    driver: local
