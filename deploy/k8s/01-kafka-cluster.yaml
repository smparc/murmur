apiVersion: v1
kind: Namespace
metadata:
  name: murmur
---
apiVersion: v1
kind: Service
metadata:
  name: murmur-kafka-broker
  namespace: murmur
  labels:
    app: murmur-kafka
spec:
  # Headless: StatefulSet pods need stable per-pod DNS for the KRaft quorum.
  clusterIP: None
  ports:
    - name: tcp-kafka
      port: 9092
      targetPort: 9092
    - name: tcp-controller
      port: 9093
      targetPort: 9093
  selector:
    app: murmur-kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: murmur-kafka
  namespace: murmur
spec:
  selector:
    matchLabels:
      app: murmur-kafka
  serviceName: murmur-kafka-broker
  replicas: 1
  template:
    metadata:
      labels:
        app: murmur-kafka
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: kafka
          image: docker.io/bitnami/kafka:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-kafka
              containerPort: 9092
            - name: tcp-controller
              containerPort: 9093
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@murmur-kafka-0.murmur-kafka-broker.murmur.svc.cluster.local:9093"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Without this, clients are handed an address they cannot resolve
            # and every consumer fails to reconnect. This is the most common
            # reason an in-cluster Kafka looks healthy but nothing can read it.
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).murmur-kafka-broker.murmur.svc.cluster.local:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_LOG_RETENTION_HOURS
              value: "6"
            - name: KAFKA_CFG_MESSAGE_MAX_BYTES
              value: "10485760"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
  # A StatefulSet without persistent storage is a Deployment with a predictable
  # name: the previous manifest kept all broker state on the container
  # filesystem and lost every unconsumed message on restart.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
